<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MusikKu - TTPod Cantik</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0a0a0f;color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,#ff2d55 0%,#ff6b35 50%,#ff2d55 100%);padding:16px 16px 12px;border-radius:0 0 22px 22px;box-shadow:0 8px 30px rgba(255,45,85,.4)}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}.logo i{font-style:normal;background:#fff;color:#ff2d55;padding:2px 8px;border-radius:20px;font-size:11px;margin-left:6px;vertical-align:middle}
.search{margin-top:14px;background:rgba(255,255,255,.95);border-radius:30px;display:flex;align-items:center;padding:4px 4px 4px 16px}
.search input{flex:1;border:none;outline:none;font-size:14px;color:#000;background:transparent}
.search button{background:#ff2d55;color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;background:rgba(255,255,255,.2);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.3)}
.chip.active{background:#fff;color:#ff2d55}
.list{flex:1;overflow-y:auto;padding:12px 12px 10px}
.list-title{font-size:13px;color:#aaa;padding:4px 4px 10px;display:flex;justify-content:space-between}
.song{display:flex;align-items:center;gap:12px;background:#16161c;padding:10px;border-radius:14px;margin-bottom:8px;cursor:pointer;border:1px solid #222}
.song.playing{background:linear-gradient(90deg,#2a0f1e,#1a1a1e);border-color:#ff2d55}
.song img{width:54px;height:54px;border-radius:12px;object-fit:cover}
.song-info{flex:1;min-width:0}.song-info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.song-info small{color:#aaa;font-size:12px}
.song-num{width:24px;text-align:center;font-weight:900;color:#666;font-size:13px}
.song.playing .song-num{color:#ff2d55}
.eq{display:flex;gap:2px;align-items:flex-end;height:18px;width:20px}.eq i{width:4px;background:#ff2d55;border-radius:2px;display:block}
.song.playing .eq i{animation:eq .5s infinite alternate}.song.playing .eq i:nth-child(2){animation-delay:.15s}.song.playing .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:18px}}
.player{background:#15151b;border-top:1px solid #222;padding:12px 14px 14px;border-radius:22px 22px 0 0}
.p-top{display:flex;align-items:center;gap:12px}
.p-top img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #ff2d55}
.p-top.playing img{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.p-info{flex:1;min-width:0}.p-info b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p-info small{color:#ff6b9d;font-size:11px;font-weight:800}.p-info span{color:#aaa;font-size:12px}
.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:0 10px}
.controls button{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.play-big{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ff2d55,#ff6b35);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,45,85,.5)}
.bar{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
.bar-track{flex:1;height:5px;background:#333;border-radius:10px;overflow:hidden}
.bar-track i{display:block;height:100%;background:linear-gradient(90deg,#ff2d55,#ff6b35);width:0%}
.vol{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#aaa}
.vol input{flex:1;accent-color:#ff2d55}
</style></head><body>

<div class="header">
<div class="top"><div class="logo">MusikKu <i>TTPod • BUNYI</i></div><div>🔔 ⚙️</div></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Cari lagu yang pasti bunyi..." value="Mahalini" onkeyup="if(event.key==='Enter')cari()"><button onclick="cari()">CARI</button></div>
<div class="tabs">
<div class="chip active" onclick="setTab(this,'Mahalini')">🔥 Mahalini</div>
<div class="chip" onclick="setTab(this,'Bernadya')">💔 Bernadya</div>
<div class="chip" onclick="setTab(this,'Hindia')">🎸 Hindia</div>
<div class="chip" onclick="setTab(this,'Juicy Luicy')">🎤 Juicy Luicy</div>
<div class="chip" onclick="setTab(this,'Nadin Amizah')">✨ Nadin</div>
<div class="chip" onclick="setTab(this,'Rizky Febian')">🎵 Rizky Febian</div>
</div>
</div>

<div class="list">
<div class="list-title"><span id="listTitle">Lagi loading...</span><span id="listCount"></span></div>
<div id="list"></div>
<div style="text-align:center;color:#555;font-size:11px;padding:15px">MusikKu TTPod V2 • MP3 Langsung • Pasti Bunyi • Tanpa Video Jelek</div>
</div>

<div class="player">
<div class="p-top" id="pTop"><img id="pImg" src="https://via.placeholder.com/56/ff2d55/fff?text=♪"><div class="p-info"><b id="pTitle">Pilih lagu, langsung bunyi!</b><small id="pStatus">● SIAP - KLIK LAGU DI ATAS</small><br><span id="pArtist">MusikKu - Tanpa YouTube, Tanpa Bisu</span></div><div style="font-size:24px" onclick="toggleLike(this)">♡</div></div>
<div class="controls"><button onclick="prev()">⏮</button><button onclick="toggleShuffle()" id="shuffleBtn">🔀</button><button class="play-big" id="playBtn" onclick="togglePlay()">▶</button><button onclick="toggleRepeat()" id="repeatBtn">🔁</button><button onclick="next()">⏭</button></div>
<div class="bar"><span id="cur">00:00</span><div class="bar-track"><i id="progBar"></i></div><span id="dur">00:00</span></div>
<div class="vol"><span>🔈</span><input type="range" id="vol" min="0" max="100" value="100" oninput="setVol(this.value)"><span>🔊</span><span id="volVal">100%</span></div>
</div>

<audio id="audio" preload="auto"></audio>

<script>
let songs=[],idx=-1;
let audio=document.getElementById('audio');
function setTab(el,q){ document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); el.classList.add('active'); cari(q); }
function fmt(s){ if(!s||isNaN(s)) return '00:00'; return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'); }

async function cari(kata){
 let q=kata||document.getElementById('q').value||'Mahalini';
 document.getElementById('q').value=q;
 document.getElementById('listTitle').innerText='🔍 Lagi nyari "'+q+'" ...';
 document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center;color:#aaa">Lagi nyari...</p>';
 try{
  // PAKE AUDIUS - FULL MP3, PASTI BUNYI, BUKAN YOUTUBE
  let r=await fetch('https://discoveryprovider.audius.co/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=30');
  let d=await r.json();
  let tracks=d.data||[];
  // Kalo Audius kosong, pake iTunes sebagai cadangan (30 detik tapi bunyi)
  if(tracks.length===0){
    let r2=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=30&country=ID');
    let d2=await r2.json();
    songs=d2.results.map(s=>({title:s.trackName,artist:s.artistName,img:s.artworkUrl100.replace('100x100','300x300'),url:s.previewUrl,full:false}));
  } else {
    songs=tracks.map(t=>({title:t.title,artist:t.user.handle||t.user.name,img:t.artwork? t.artwork['480x480'] : 'https://via.placeholder.com/300/ff2d55/fff?text=♪',url:'https://discoveryprovider.audius.co/v1/tracks/'+t.id+'/stream',full:true}));
  }
  let h='';
  songs.forEach((s,i)=>{ h+=`<div class="song" id="song-${i}" onclick="play(${i})"><div class="song-num">${i+1}</div><img src="${s.img}"><div class="song-info"><b>${s.title}</b><small>${s.artist} • ${s.full?'FULL MP3 • PASTI BUNYI':'PREVIEW 30 detik'}</small></div><div class="eq"><i style="height:6px"></i><i style="height:12px"></i><i style="height:8px"></i></div><div>▶</div></div>`; });
  document.getElementById('list').innerHTML=h||'<p style="padding:20px;text-align:center">Ga ketemu, coba kata lain<br><small>Coba: Mahalini, Bernadya, Hindia</small></p>';
  document.getElementById('listTitle').innerText='🎵 '+q+' - '+songs.length+' Lagu';
 }catch(e){ document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center">Internet lu mati, klik CARI lagi</p>'; }
}
function play(i){
 idx=i; let s=songs[i]; if(!s) return;
 document.querySelectorAll('.song').forEach(e=>e.classList.remove('playing'));
 let el=document.getElementById('song-'+i); if(el) el.classList.add('playing');
 document.getElementById('pImg').src=s.img;
 document.getElementById('pTitle').innerText=s.title;
 document.getElementById('pArtist').innerText=s.artist+' • '+(s.full?'FULL MP3':'PREVIEW');
 document.getElementById('pStatus').innerText='● LAGI MUTER • SUARA PASTI BUNYI 🔊';
 document.getElementById('pTop').classList.add('playing');
 document.getElementById('listCount').innerText=(i+1)+' / '+songs.length;
 audio.src=s.url; audio.volume=document.getElementById('vol').value/100; audio.play().then(()=>{ document.getElementById('playBtn').innerText='⏸'; }).catch(()=>{ document.getElementById('pStatus').innerText='⚠️ Klik tombol ▶ di bawah 1x biar bunyi'; document.getElementById('playBtn').innerText='▶'; });
}
function togglePlay(){
 if(idx===-1) return play(0);
 if(audio.paused){ audio.play(); document.getElementById('playBtn').innerText='⏸'; document.getElementById('pTop').classList.add('playing'); }
 else{ audio.pause(); document.getElementById('playBtn').innerText='▶'; document.getElementById('pTop').classList.remove('playing'); }
}
function setVol(v){ audio.volume=v/100; document.getElementById('volVal').innerText=v+'%'; }
function next(){ if(idx<songs.length-1) play(idx+1); else play(0); }
function prev(){ if(idx>0) play(idx-1); }
function toggleLike(el){ el.innerText=el.innerText==='♡'?'❤️':'♡'; }
function toggleShuffle(){ let b=document.getElementById('shuffleBtn'); b.style.color=b.style.color==='rgb(255, 45, 85)'?'#fff':'#ff2d55'; }
function toggleRepeat(){ let b=document.getElementById('repeatBtn'); audio.loop=!audio.loop; b.style.color=audio.loop?'#ff2d55':'#fff'; }
audio.addEventListener('timeupdate',()=>{ if(audio.duration){ document.getElementById('progBar').style.width=(audio.currentTime/audio.duration*100)+'%'; document.getElementById('cur').innerText=fmt(audio.currentTime); document.getElementById('dur').innerText=fmt(audio.duration); } });
audio.addEventListener('ended',()=>{ next(); });
audio.addEventListener('error',()=>{ document.getElementById('pStatus').innerText='⚠️ Lagu ini gagal, lagi ganti ke lagu berikutnya...'; setTimeout(next,1000); });
cari('Mahalini');
</script>
</body></html>
