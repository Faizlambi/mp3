<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MusikKu - TTPod Style</title>
<meta name="theme-color" content="#e91e63">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0f0f12;color:#fff;overflow:hidden;height:100dvh;display:flex;flex-direction:column}
/* HEADER TTPOD */
.header{background:linear-gradient(180deg,#ff2d55,#c2185b);padding:14px 15px 10px;box-shadow:0 4px 15px rgba(0,0,0,.4)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;letter-spacing:.5px}.logo span{font-size:11px;background:#fff;color:#e91e63;padding:2px 6px;border-radius:10px;margin-left:5px;vertical-align:middle}
.search-bar{margin-top:12px;background:rgba(255,255,255,.22);border-radius:30px;display:flex;align-items:center;padding:9px 14px;gap:8px}
.search-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px}
.search-bar input::placeholder{color:rgba(255,255,255,.8)}
.search-bar button{background:#fff;color:#e91e63;border:none;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px}
.tabs{display:flex;gap:5px;margin-top:12px}
.tab{flex:1;text-align:center;padding:9px 0;font-size:13px;font-weight:700;color:rgba(255,255,255,.7);border-radius:20px;cursor:pointer}
.tab.active{background:#fff;color:#e91e63}
/* LIST LAGU TTPOD */
.list{flex:1;overflow-y:auto;padding:5px 0 20px}
.list-head{padding:10px 15px;font-size:12px;color:#aaa;display:flex;justify-content:space-between}
.song{display:flex;align-items:center;gap:12px;padding:10px 15px;cursor:pointer;border-bottom:1px solid #1e1e22}
.song:active{background:#1e1e22}.song.playing{background:#2a1220;border-left:4px solid #ff2d55}
.song-num{width:28px;text-align:center;font-size:13px;color:#888;font-weight:700}
.song.playing .song-num{color:#ff2d55}
.song img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.song-info{flex:1;min-width:0}
.song-info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-info small{color:#aaa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.eq{display:flex;gap:2px;align-items:flex-end;height:18px;width:22px}
.eq i{display:block;width:4px;background:#ff2d55;border-radius:2px}
.song.playing .eq i{animation:eq .5s infinite alternate}
.song.playing .eq i:nth-child(2){animation-delay:.15s}.song.playing .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{from{height:4px}to{height:18px}}
.dur{font-size:11px;color:#888}
/* YOUTUBE PLAYER - SEMBUNYI TAPI MUTER FULL */
#ytWrap{background:#000}
#ytWrap iframe{width:100%;height:0;border:none;transition:.3s}
#ytWrap.show iframe{height:210px}
/* PLAYER BAWAH TTPOD */
.player{background:#1a1a1e;border-top:1px solid #2a2a2e;padding:10px 12px 12px}
.player-top{display:flex;align-items:center;gap:12px}
.player-top img{width:52px;height:52px;border-radius:50%;object-fit:cover;animation:spin 8s linear infinite;animation-play-state:paused}
.player-top.playing img{animation-play-state:running;border:2px solid #ff2d55}
@keyframes spin{to{transform:rotate(360deg)}}
.p-info{flex:1;min-width:0}.p-info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p-info small{color:#ff2d55;font-size:11px;font-weight:700}
.p-info span{font-size:11px;color:#aaa}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.controls button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.controls .play-big{width:52px;height:52px;border-radius:50%;background:#ff2d55;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(255,45,85,.5)}
.progress{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
.progress-bar{flex:1;height:4px;background:#333;border-radius:10px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:#ff2d55;width:0%}
.yt-btn{width:100%;background:#ff0000;color:#fff;border:none;padding:8px;border-radius:20px;font-weight:800;font-size:12px;margin-top:8px;cursor:pointer}
</style></head><body>

<!-- HEADER -->
<div class="header">
<div class="header-top"><div class="logo">TTPod<span>FULL</span></div><div style="font-size:20px">⚙️ ⋮</div></div>
<div class="search-bar">🔍 <input id="q" placeholder="Cari lagu, artis... (FULL LAGU)" value="Mahalini" onkeyup="if(event.key==='Enter')cari()"><button onclick="cari()">CARI</button></div>
<div class="tabs">
<div class="tab active" onclick="setTab(this,'Mahalini')">🔥 Trending</div>
<div class="tab" onclick="setTab(this,'Top Hits Indonesia 2026')">🏆 Top Hits</div>
<div class="tab" onclick="setTab(this,'Galau')">💔 Galau</div>
<div class="tab" onclick="setTab(this,'Dangdut')">🎤 Dangdut</div>
</div>
</div>

<!-- LIST -->
<div class="list">
<div class="list-head"><span id="listTitle">🎵 Mahalini - 24 Lagu • FULL via YouTube</span><span id="listCount">Memutar: -</span></div>
<div id="list"><p style="padding:20px;text-align:center;color:#aaa">Lagi loading lagu...</p></div>
<div style="padding:15px;text-align:center;color:#666;font-size:11px">MusikKu TTPod • Full Song via YouTube • Gratis tanpa login</div>
</div>

<!-- YOUTUBE - TEMPAT LAGU FULL MUTER -->
<div id="ytWrap"><iframe id="ytFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>

<!-- PLAYER -->
<div class="player">
<div class="player-top" id="pTop">
<img id="pImg" src="https://via.placeholder.com/52/ff2d55/fff?text=♪">
<div class="p-info"><b id="pTitle">Pilih Lagu Dulu</b><small id="pStatus">● SIAP • FULL SONG</small><br><span id="pArtist">MusikKu TTPod - Klik lagu di atas</span></div>
<div style="font-size:22px" onclick="toggleLike(this)">♡</div>
</div>
<div class="controls">
<button onclick="prev()">⏮</button>
<button onclick="toggleMode()" id="modeBtn" title="Mode">🔀</button>
<button class="play-big" id="playBtn" onclick="togglePlay()">▶</button>
<button onclick="next()">⏭</button>
<button onclick="toggleVideo()">📺</button>
</div>
<div class="progress"><span id="cur">00:00</span><div class="progress-bar"><i id="progBar"></i></div><span>FULL</span></div>
<button class="yt-btn" onclick="toggleVideo()">▶ LIAT VIDEO / SEMBUNYIKAN VIDEO</button>
</div>

<script>
let songs=[],idx=-1,isPlaying=false,videoShown=false,like=false,prog=0,progTimer=null;
function setTab(el,q){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); cari(q); }
async function cari(kata){
 let q=kata||document.getElementById('q').value||'Mahalini';
 document.getElementById('q').value=q;
 document.getElementById('listTitle').innerText='🎵 '+q+' - Lagi nyari...';
 document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center;color:#aaa">Lagi nyari "'+q+'"...</p>';
 try{
  let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=30&country=ID');
  let d=await r.json(); songs=d.results;
  let h='';
  songs.forEach((s,i)=>{
    let dur=Math.floor(Math.random()*2+2)+':'+String(Math.floor(Math.random()*59)).padStart(2,'0');
    h+=`<div class="song" id="song-${i}" onclick="play(${i})"><div class="song-num">${i+1}</div><img src="${s.artworkUrl100.replace('100x100','300x300')}"><div class="song-info"><b>${s.trackName}</b><small>${s.artistName} • ${s.collectionName||'Single'}</small></div><div class="eq"><i style="height:8px"></i><i style="height:14px"></i><i style="height:6px"></i></div><div class="dur">${dur}<br>⋮</div></div>`;
  });
  document.getElementById('list').innerHTML=h||'<p style="padding:20px;text-align:center">Ga ketemu, coba kata lain</p>';
  document.getElementById('listTitle').innerText='🎵 '+q+' - '+songs.length+' Lagu • FULL via YouTube';
 }catch(e){ document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center">Internet lu mati, klik CARI lagi</p>'; }
}
function play(i){
 idx=i; let s=songs[i]; if(!s) return;
 document.querySelectorAll('.song').forEach(el=>el.classList.remove('playing'));
 let el=document.getElementById('song-'+i); if(el) el.classList.add('playing');
 document.getElementById('pImg').src=s.artworkUrl100.replace('100x100','300x300');
 document.getElementById('pTitle').innerText=s.trackName;
 document.getElementById('pArtist').innerText=s.artistName+' • '+ (s.collectionName||'');
 document.getElementById('pStatus').innerText='● LAGI MUTER FULL • '+s.artistName;
 document.getElementById('pTop').classList.add('playing');
 document.getElementById('listCount').innerText='Memutar: '+(i+1)+' / '+songs.length;
 // KUNCI FULL LAGU: YOUTUBE SEARCH
 let query=encodeURIComponent(s.trackName+' '+s.artistName+' official audio');
 document.getElementById('ytFrame').src='https://www.youtube.com/embed?listType=search&list='+query+'&autoplay=1&rel=0';
 isPlaying=true; document.getElementById('playBtn').innerText='⏸';
 startProgress();
 document.getElementById('list').scrollTop=0;
}
function startProgress(){ clearInterval(progTimer); prog=0; progTimer=setInterval(()=>{ prog+=0.3; if(prog>100) prog=0; document.getElementById('progBar').style.width=prog+'%'; let sec=Math.floor(prog*2.2); document.getElementById('cur').innerText=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); },500); }
function togglePlay(){
 let f=document.getElementById('ytFrame');
 if(idx===-1) return play(0);
 if(isPlaying){ f.src=f.src.replace('autoplay=1','autoplay=0'); document.getElementById('playBtn').innerText='▶'; document.getElementById('pTop').classList.remove('playing'); document.getElementById('pStatus').innerText='⏸ DIJEDA'; isPlaying=false; clearInterval(progTimer); }
 else{ f.src=f.src.replace('autoplay=0','autoplay=1'); document.getElementById('playBtn').innerText='⏸'; document.getElementById('pTop').classList.add('playing'); document.getElementById('pStatus').innerText='● LAGI MUTER FULL'; isPlaying=true; startProgress(); }
}
function toggleVideo(){ videoShown=!videoShown; document.getElementById('ytWrap').classList.toggle('show',videoShown); }
function toggleLike(el){ like=!like; el.innerText=like?'❤️':'♡'; el.style.color=like?'#ff2d55':'#fff'; }
function toggleMode(){ let b=document.getElementById('modeBtn'); b.innerText=b.innerText==='🔀'?'🔁':'🔀'; }
function next(){ if(idx<songs.length-1) play(idx+1); else play(0); }
function prev(){ if(idx>0) play(idx-1); }
cari('Mahalini');
</script>
</body></html>
